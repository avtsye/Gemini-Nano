<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gemini Nano</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="launcher">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <h1>Gemini Nano</h1>
        <p>Local AI Workspace</p>
      </div>
    </div>

    <div class="status-card">
      <span id="dot" class="dot"></span>
      <div>
        <strong id="status">בודק את המודל...</strong>
        <small id="statusDetail">הכול פועל מקומית ב-Chrome</small>
      </div>
    </div>

    <button id="openPanel" class="primary">פתח סביבת עבודה</button>
    <button id="newChat" class="secondary">פתח שיחה חדשה</button>

    <div class="privacy">ללא API key • היסטוריה מקומית • Gemini Nano</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
